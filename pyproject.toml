[project]
name = "onlabel"
version = "0.1.0"
description = "MLR pre-check agent: traces promotional drug claims to the FDA label and flags the ones it cannot ground."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.50",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
